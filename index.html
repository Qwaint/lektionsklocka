<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101010">
<title>Lektionsklocka</title>
<!-- Lektionsklocka v1.2 -->
<style>
:root{color-scheme:dark;--bg:#101010;--fg:#f7f7f5;--muted:#a5a5a1;--danger:#e5484d;--button:#242424}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
main{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(28px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
#lesson{font-size:clamp(25px,3vw,38px);font-weight:720}
#range{font-size:clamp(16px,1.8vw,22px);color:var(--muted);margin-top:4px}
#clock{font-size:clamp(34px,4vw,52px);font-weight:650;font-variant-numeric:tabular-nums}
.center{display:flex;align-items:center;justify-content:center;min-height:0}
.timer{width:min(62vw,59vh,550px);aspect-ratio:1;position:relative;transition:opacity .2s ease}
.face{position:absolute;inset:0;border-radius:50%;background:#262626;box-shadow:inset 0 0 0 2px #333}
.sector{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--fg) 0deg,var(--fg) var(--angle),transparent var(--angle),transparent 360deg);transform:scale(.93)}
.hub{position:absolute;inset:12%;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#remaining{font-size:clamp(62px,11vw,126px);font-weight:760;line-height:.92;font-variant-numeric:tabular-nums}
#label{font-size:clamp(18px,2.3vw,28px);color:var(--muted);margin-top:13px}
.timer.danger .sector{--fg:var(--danger)}.timer.danger #label{color:var(--danger)}
.timer.danger #remaining{color:var(--danger)}
.timer.idle .face,.timer.idle .sector{display:none}
.timer.idle .hub{inset:0;background:transparent}
.timer.idle #remaining{font-size:clamp(58px,10vw,116px)}
.timer.idle #label{font-size:clamp(19px,2.4vw,29px)}
footer{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:0 6px 8px}
#next{font-size:clamp(16px,1.9vw,22px);color:var(--muted);min-height:28px}
button{border:0;border-radius:12px;padding:9px 13px;background:var(--button);color:var(--muted);font-size:15px}
dialog{width:min(760px,94vw);max-height:88vh;border:0;border-radius:20px;padding:22px;background:#1b1b1b;color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.55)}
textarea{width:100%;min-height:300px;background:#111;color:var(--fg);border:1px solid #444;border-radius:12px;padding:12px;font:16px ui-monospace,SFMono-Regular,Menlo,monospace}
.help{color:var(--muted);line-height:1.45}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media(max-width:700px){main{padding:22px}.timer{width:min(78vw,54vh)}}
</style>
</head>
<body>
<main>
<header>
 <div><div id="lesson">Lektionsklocka</div><div id="range"></div></div>
 <div id="clock">--:--</div>
</header>

<section class="center">
 <div class="timer" id="timer">
   <div class="face"></div>
   <div class="sector" id="sector"></div>
   <div class="hub">
     <div id="remaining">—</div>
     <div id="label"></div>
   </div>
 </div>
</section>

<footer>
 <div id="next"></div>
 <button id="edit">Schema</button>
</footer>
</main>

<dialog id="dlg">
<h2>Veckoschema</h2>
<p class="help">En lektion per rad: <b>dag,start,slut,namn</b><br>Exempel: <code>mån,10:40,11:30,EK25</code></p>
<textarea id="ta"></textarea>
<div class="actions"><button id="cancel">Avbryt</button><button id="save">Spara</button></div>
</dialog>

<script>
const DEF=`mån,10:40,11:30,EK25
ons,09:20,10:05,NATEES24
ons,10:20,11:05,EK25`;
const dm={sön:0,son:0,mån:1,man:1,tis:2,ons:3,tor:4,fre:5,lör:6,lor:6};
const names=['sön','mån','tis','ons','tor','fre','lör'];

function parse(t){
 return t.split(/\n/).map(x=>x.trim()).filter(Boolean).map(l=>{
  let [d,s,e,...n]=l.split(',').map(x=>x.trim());
  return dm[d?.toLowerCase()]!==undefined&&/^\d\d:\d\d$/.test(s)&&/^\d\d:\d\d$/.test(e)&&n.length
   ?{day:dm[d.toLowerCase()],start:s,end:e,name:n.join(',')}:null
 }).filter(Boolean)
}
function tm(d,x){let q=new Date(d),[h,m]=x.split(':').map(Number);q.setHours(h,m,0,0);return q}
function occurrences(now,a){
 let o=[];
 for(let k=-1;k<9;k++){
  let d=new Date(now);d.setDate(now.getDate()+k);
  for(let s of a)if(d.getDay()===s.day){
   let b=tm(d,s.start),e=tm(d,s.end);if(e<=b)e.setDate(e.getDate()+1);
   o.push({...s,b,e})
  }
 }
 return o.sort((x,y)=>x.b-y.b)
}
const ft=d=>d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
function until(ms){
 let m=Math.max(0,Math.ceil(ms/60000));
 if(m<60)return `${m} min`;
 let h=Math.floor(m/60),r=m%60;
 if(h<24)return r?`${h} h ${r} min`:`${h} h`;
 let d=Math.floor(h/24),rh=h%24;
 return rh?`${d} d ${rh} h`:`${d} d`;
}
function bigUntil(ms){
 let m=Math.max(0,Math.ceil(ms/60000));
 if(m<60)return [String(m),'minuter tills start'];
 let h=Math.floor(m/60),r=m%60;
 if(h<24)return [`${h}:${String(r).padStart(2,'0')}`,'tills lektionen börjar'];
 let d=Math.floor(h/24),rh=h%24;
 return [`${d} d ${rh} h`,'tills nästa lektion'];
}
function update(){
 const now=new Date(), schedule=parse(localStorage.lessonSchedule||DEF), occ=occurrences(now,schedule);
 const cur=occ.find(x=>now>=x.b&&now<x.e), nx=occ.find(x=>x.b>now);
 clock.textContent=ft(now);
 timer.classList.remove('danger','idle');

 if(cur){
   const left=cur.e-now,total=cur.e-cur.b,f=Math.max(0,Math.min(1,left/total));
   lesson.textContent=cur.name;
   range.textContent=`${ft(cur.b)}–${ft(cur.e)}`;
   remaining.textContent=Math.ceil(left/60000);
   label.textContent='minuter kvar';
   sector.style.setProperty('--angle',`${f*360}deg`);
   if(left<=5*60*1000)timer.classList.add('danger');
   next.textContent=nx?`Nästa: ${nx.name} · ${names[nx.b.getDay()]} ${ft(nx.b)}–${ft(nx.e)} · om ${until(nx.b-now)}`:'';
 }else if(nx){
   timer.classList.add('idle');
   lesson.textContent=`Nästa: ${nx.name}`;
   range.textContent=`${names[nx.b.getDay()]} ${ft(nx.b)}–${ft(nx.e)}`;
   const [big,lab]=bigUntil(nx.b-now);
   remaining.textContent=big; label.textContent=lab;
   sector.style.setProperty('--angle','0deg');
   next.textContent='';
 }else{
   lesson.textContent='Ingen kommande lektion';
   range.textContent=''; remaining.textContent='—'; label.textContent='';
   sector.style.setProperty('--angle','0deg'); next.textContent='';
 }
}
edit.onclick=()=>{ta.value=localStorage.lessonSchedule||DEF;dlg.showModal()};
cancel.onclick=()=>dlg.close();
save.onclick=()=>{localStorage.lessonSchedule=ta.value;dlg.close();update()};
update();setInterval(update,1000);
</script>
</body></html>
