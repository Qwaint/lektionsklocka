<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Lektionsklocka</title>
<style>:root{color-scheme:light dark;--bg:#f4f4f1;--fg:#151515;--muted:#777;--track:#d2d2cd}@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#f5f5f3;--muted:#aaa;--track:#393937}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif}main{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:30px}header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px}#lesson{font-size:clamp(24px,3vw,38px);font-weight:700}#range,#next{color:var(--muted);font-size:clamp(16px,2vw,22px)}#clock{font-size:clamp(30px,4vw,50px);font-weight:650;font-variant-numeric:tabular-nums}.center{display:flex;align-items:center;justify-content:center}.timer{width:min(70vw,68vh,620px);aspect-ratio:1;position:relative}svg{width:100%;height:100%;transform:rotate(-90deg)}circle{fill:none;stroke-width:7}.track{stroke:var(--track)}.progress{stroke:var(--fg);stroke-linecap:round}.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.remaining{font-size:clamp(65px,12vw,130px);font-weight:750;line-height:1}.label{color:var(--muted);font-size:clamp(18px,2.5vw,28px);margin-top:10px}button{border:1px solid var(--track);border-radius:13px;padding:10px 14px;background:transparent;color:var(--fg);font-size:16px}dialog{width:min(760px,94vw);border:0;border-radius:18px;padding:22px}textarea{width:100%;min-height:280px;font:16px ui-monospace,monospace;padding:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}</style></head>
<body><main><header><div><div id="lesson">Ingen lektion</div><div id="range"></div></div><div id="clock">--:--</div></header>
<section class="center"><div class="timer"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="progress" cx="60" cy="60" r="52"/></svg><div class="inside"><div class="remaining" id="remaining">—</div><div class="label" id="label">minuter kvar</div></div></div></section>
<footer><div id="next"></div><button id="edit">Redigera schema</button></footer></main>
<dialog id="dlg"><h2>Veckoschema</h2><p>En rad per lektion: <b>dag,start,slut,namn</b><br>Exempel: <code>mån,10:40,11:30,EK25</code></p><textarea id="ta"></textarea><div class="actions"><button id="cancel">Avbryt</button><button id="save">Spara</button></div></dialog>
<script>
const DEF=`mån,10:40,11:30,EK25
ons,09:20,10:05,NATEES24
ons,10:20,11:05,EK25`;
const dm={sön:0,son:0,mån:1,man:1,tis:2,ons:3,tor:4,fre:5,lör:6,lor:6},C=2*Math.PI*52,p=document.querySelector('.progress');p.style.strokeDasharray=C;
function parse(t){return t.split(/\n/).map(x=>x.trim()).filter(Boolean).map(l=>{let [d,s,e,...n]=l.split(',').map(x=>x.trim());return dm[d?.toLowerCase()]!==undefined&&/^\d\d:\d\d$/.test(s)&&/^\d\d:\d\d$/.test(e)&&n.length?{day:dm[d.toLowerCase()],start:s,end:e,name:n.join(',')}:null}).filter(Boolean)}
function tm(d,x){let q=new Date(d),[h,m]=x.split(':').map(Number);q.setHours(h,m,0,0);return q}
function occ(now,a){let o=[];for(let k=-1;k<8;k++){let d=new Date(now);d.setDate(now.getDate()+k);for(let s of a)if(d.getDay()==s.day){let b=tm(d,s.start),e=tm(d,s.end);if(e<=b)e.setDate(e.getDate()+1);o.push({...s,b,e})}}return o.sort((x,y)=>x.b-y.b)}
const ft=d=>d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
function upd(){let now=new Date(),o=occ(now,parse(localStorage.lessonSchedule||DEF)),cur=o.find(x=>now>=x.b&&now<x.e),nx=o.find(x=>x.b>now);clock.textContent=ft(now);if(cur){let left=cur.e-now,total=cur.e-cur.b,f=Math.max(0,Math.min(1,left/total));lesson.textContent=cur.name;range.textContent=ft(cur.b)+'–'+ft(cur.e);remaining.textContent=Math.ceil(left/60000);label.textContent='minuter kvar';p.style.strokeDashoffset=C*(1-f)}else{lesson.textContent='Ingen lektion just nu';range.textContent='';remaining.textContent='—';label.textContent='';p.style.strokeDashoffset=C}next.textContent=nx?'Nästa: '+nx.name+' · '+ft(nx.b):'Ingen kommande lektion'}
edit.onclick=()=>{ta.value=localStorage.lessonSchedule||DEF;dlg.showModal()};cancel.onclick=()=>dlg.close();save.onclick=()=>{localStorage.lessonSchedule=ta.value;dlg.close();upd()};upd();setInterval(upd,1000);
</script></body></html>
