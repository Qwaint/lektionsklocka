<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101010">
<title>Lektionsklocka</title>
<!-- Lektionsklocka v1.4 -->

<style>
:root{
  color-scheme:dark;
  --bg:#101010;
  --fg:#f7f7f5;
  --muted:#a5a5a1;
  --danger:#e5484d;
  --button:#242424;
  --line:#343434
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif
}

main{
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:
    max(28px,env(safe-area-inset-top))
    max(32px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(32px,env(safe-area-inset-left))
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:24px
}

#lesson{
  font-size:clamp(25px,3vw,38px);
  font-weight:720
}

#range{
  font-size:clamp(16px,1.8vw,22px);
  color:var(--muted);
  margin-top:4px
}

.clockbox{
  text-align:right;
  flex-shrink:0
}

#clock{
  font-size:clamp(34px,4vw,52px);
  font-weight:650;
  font-variant-numeric:tabular-nums
}

#date{
  font-size:clamp(14px,1.5vw,19px);
  color:var(--muted);
  margin-top:2px
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0
}

.timer{
  width:min(62vw,59vh,550px);
  aspect-ratio:1;
  position:relative;
  transition:opacity .2s ease
}

.face{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#262626;
  box-shadow:inset 0 0 0 2px #333
}

.sector{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(
      from 0deg,
      var(--fg) 0deg,
      var(--fg) var(--angle),
      transparent var(--angle),
      transparent 360deg
    );
  transform:scale(.93)
}

.hub{
  position:absolute;
  inset:12%;
  border-radius:50%;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center
}

#remaining{
  font-size:clamp(62px,11vw,126px);
  font-weight:760;
  line-height:.92;
  font-variant-numeric:tabular-nums
}

#label{
  font-size:clamp(18px,2.3vw,28px);
  color:var(--muted);
  margin-top:13px
}

.timer.danger .sector{
  --fg:var(--danger)
}

.timer.danger #label,
.timer.danger #remaining{
  color:var(--danger)
}

.timer.idle .face,
.timer.idle .sector{
  display:none
}

.timer.idle .hub{
  inset:0;
  background:transparent
}

.timer.idle #remaining{
  font-size:clamp(58px,10vw,116px)
}

.timer.idle #label{
  font-size:clamp(19px,2.4vw,29px)
}

footer{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  gap:24px;
  padding:0 6px 8px
}

/* Nästa lektion under pågående lektion */

#next{
  min-height:28px;
  color:var(--muted)
}

.next-label{
  font-size:clamp(15px,1.7vw,20px);
  margin-bottom:2px
}

.next-main{
  font-size:clamp(17px,2vw,23px);
  line-height:1.25
}

.next-main strong{
  color:var(--fg);
  font-weight:650
}

.next-until{
  font-size:clamp(16px,1.8vw,21px);
  margin-top:2px
}

button{
  border:0;
  border-radius:12px;
  padding:9px 13px;
  background:var(--button);
  color:var(--muted);
  font-size:15px;
  cursor:pointer
}

button:hover{
  color:var(--fg)
}

/* Dialog */

dialog{
  width:min(760px,94vw);
  max-height:88vh;
  border:0;
  border-radius:20px;
  padding:22px;
  background:#1b1b1b;
  color:var(--fg)
}

dialog::backdrop{
  background:rgba(0,0,0,.58)
}

.dialog-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px
}

.dialog-head h2{
  margin:0;
  font-size:25px
}

.dialog-head-actions{
  display:flex;
  gap:8px
}

/* Schemavy */

#scheduleView{
  overflow:auto
}

.day{
  margin-top:23px
}

.day:first-child{
  margin-top:0
}

.day-title{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding-bottom:8px;
  border-bottom:1px solid var(--line)
}

.day.today .day-title{
  color:var(--fg)
}

.day.today .day-title::after{
  content:"  ·  idag";
  color:var(--muted);
  font-weight:500;
  letter-spacing:0;
  text-transform:none
}

.schedule-row{
  display:grid;
  grid-template-columns:120px 1fr auto;
  gap:16px;
  align-items:center;
  padding:10px 2px;
  border-bottom:1px solid #292929
}

.schedule-time{
  color:var(--muted);
  font-variant-numeric:tabular-nums
}

.schedule-name{
  font-weight:620;
  font-size:17px
}

.schedule-room{
  color:var(--muted);
  text-align:right
}

/* Editor */

#editorView{
  display:none
}

textarea{
  width:100%;
  min-height:300px;
  background:#111;
  color:var(--fg);
  border:1px solid #444;
  border-radius:12px;
  padding:12px;
  font:16px ui-monospace,SFMono-Regular,Menlo,monospace
}

.help{
  color:var(--muted);
  line-height:1.45
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:14px
}

@media(max-width:700px){

  main{
    padding:22px
  }

  .timer{
    width:min(78vw,54vh)
  }

  .schedule-row{
    grid-template-columns:95px 1fr auto;
    gap:9px
  }

  dialog{
    padding:18px
  }
}

</style>
</head>

<body>

<main>

<header>
  <div>
    <div id="lesson">Lektionsklocka</div>
    <div id="range"></div>
  </div>

  <div class="clockbox">
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
</header>

<section class="center">
  <div class="timer" id="timer">
    <div class="face"></div>
    <div class="sector" id="sector"></div>

    <div class="hub">
      <div id="remaining">—</div>
      <div id="label"></div>
    </div>
  </div>
</section>

<footer>
  <div id="next"></div>
  <button id="edit">Schema</button>
</footer>

</main>


<dialog id="dlg">

  <!-- ÖVERSIKT -->

  <div id="overviewView">

    <div class="dialog-head">
      <h2>Veckoschema</h2>

      <div class="dialog-head-actions">
        <button id="editSchedule">Redigera</button>
        <button id="closeSchedule">Stäng</button>
      </div>
    </div>

    <div id="scheduleView"></div>

  </div>


  <!-- REDIGERING -->

  <div id="editorView">

    <div class="dialog-head">
      <h2>Redigera schema</h2>
    </div>

    <p class="help">
      En lektion per rad:
      <b>dag,start,slut,namn,sal</b><br>
      Exempel:
      <code>mån,10:40,11:30,EK25,417</code><br><br>
      Sal är frivilligt.
    </p>

    <textarea id="ta"></textarea>

    <div class="actions">
      <button id="cancel">Avbryt</button>
      <button id="save">Spara</button>
    </div>

  </div>

</dialog>


<script>

const DEF=`mån,10:40,11:30,EK25,417
ons,09:20,10:05,NATEES24,312
ons,10:20,11:05,EK25,417`;

const dm={
  sön:0,
  son:0,
  mån:1,
  man:1,
  tis:2,
  ons:3,
  tor:4,
  tors:4,
  fre:5,
  lör:6,
  lor:6
};

const names=[
  'sön',
  'mån',
  'tis',
  'ons',
  'tor',
  'fre',
  'lör'
];

const fullNames=[
  'Söndag',
  'Måndag',
  'Tisdag',
  'Onsdag',
  'Torsdag',
  'Fredag',
  'Lördag'
];

const dateNames=[
  'sön',
  'mån',
  'tis',
  'ons',
  'tors',
  'fre',
  'lör'
];


function parse(t){

  return t
    .split(/\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(l=>{

      let parts=l.split(',').map(x=>x.trim());

      let d=parts[0];
      let s=parts[1];
      let e=parts[2];
      let name=parts[3];
      let room=parts[4] || '';

      return (
        dm[d?.toLowerCase()]!==undefined &&
        /^\d\d:\d\d$/.test(s) &&
        /^\d\d:\d\d$/.test(e) &&
        name
      )
      ?{
        day:dm[d.toLowerCase()],
        start:s,
        end:e,
        name:name,
        room:room
      }
      :null;

    })
    .filter(Boolean);
}


function tm(d,x){

  let q=new Date(d);

  let [h,m]=x
    .split(':')
    .map(Number);

  q.setHours(h,m,0,0);

  return q;
}


function occurrences(now,a){

  let o=[];

  for(let k=-1;k<9;k++){

    let d=new Date(now);

    d.setDate(
      now.getDate()+k
    );

    for(let s of a){

      if(d.getDay()===s.day){

        let b=tm(d,s.start);
        let e=tm(d,s.end);

        if(e<=b)
          e.setDate(e.getDate()+1);

        o.push({
          ...s,
          b,
          e
        });

      }
    }
  }

  return o.sort(
    (x,y)=>x.b-y.b
  );
}


const ft=d=>
  d.toLocaleTimeString(
    'sv-SE',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );


function formatDate(d){

  return `${dateNames[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString(
    'sv-SE',
    {month:'short'}
  ).replace('.','')}`;

}


function roomText(room){

  return room
    ?` · sal ${room}`
    :'';

}


function until(ms){

  let m=Math.max(
    0,
    Math.ceil(ms/60000)
  );

  if(m<60)
    return `${m} min`;

  let h=Math.floor(m/60);
  let r=m%60;

  if(h<24)
    return r
      ?`${h} h ${r} min`
      :`${h} h`;

  let d=Math.floor(h/24);
  let rh=h%24;

  return rh
    ?`${d} d ${rh} h`
    :`${d} d`;
}


function bigUntil(ms){

  let m=Math.max(
    0,
    Math.ceil(ms/60000)
  );

  if(m<60)
    return [
      String(m),
      'minuter tills start'
    ];

  let h=Math.floor(m/60);
  let r=m%60;

  if(h<24)
    return [
      `${h}:${String(r).padStart(2,'0')}`,
      'tills lektionen börjar'
    ];

  let d=Math.floor(h/24);
  let rh=h%24;

  return [
    `${d} d ${rh} h`,
    'tills nästa lektion'
  ];
}


/* -------------------------
   Schemavy
------------------------- */

function renderSchedule(){

  const schedule=parse(
    localStorage.lessonSchedule || DEF
  );

  const today=new Date().getDay();

  scheduleView.innerHTML='';

  for(let day=1;day<=6;day++){

    const lessons=schedule
      .filter(x=>x.day===day)
      .sort((a,b)=>a.start.localeCompare(b.start));

    if(!lessons.length)
      continue;


    const group=document.createElement('div');

    group.className=
      'day' + (day===today ? ' today' : '');


    const title=document.createElement('div');

    title.className='day-title';
    title.textContent=fullNames[day];

    group.appendChild(title);


    for(const s of lessons){

      const row=document.createElement('div');

      row.className='schedule-row';


      const time=document.createElement('div');

      time.className='schedule-time';
      time.textContent=`${s.start}–${s.end}`;


      const name=document.createElement('div');

      name.className='schedule-name';
      name.textContent=s.name;


      const room=document.createElement('div');

      room.className='schedule-room';
      room.textContent=s.room
        ?`sal ${s.room}`
        :'';


      row.append(
        time,
        name,
        room
      );

      group.appendChild(row);

    }


    scheduleView.appendChild(group);

  }

}


/* -------------------------
   Klockan
------------------------- */

function update(){

  const now=new Date();

  const schedule=parse(
    localStorage.lessonSchedule || DEF
  );

  const occ=occurrences(
    now,
    schedule
  );

  const cur=occ.find(
    x=>now>=x.b && now<x.e
  );

  const nx=occ.find(
    x=>x.b>now
  );


  clock.textContent=ft(now);
  date.textContent=formatDate(now);

  timer.classList.remove(
    'danger',
    'idle'
  );


  if(cur){

    const left=cur.e-now;
    const total=cur.e-cur.b;

    const f=Math.max(
      0,
      Math.min(
        1,
        left/total
      )
    );


    lesson.textContent=cur.name;

    range.textContent=
      `${ft(cur.b)}–${ft(cur.e)}${roomText(cur.room)}`;

    remaining.textContent=
      Math.ceil(left/60000);

    label.textContent=
      'minuter kvar';

    sector.style.setProperty(
      '--angle',
      `${f*360}deg`
    );


    if(left<=5*60*1000)
      timer.classList.add('danger');


    if(nx){

      const room=
        nx.room
          ?`, sal ${nx.room}`
          :'';

      next.innerHTML=`
        <div class="next-label">Nästa:</div>
        <div class="next-main">
          <strong>${nx.name}</strong>, ${ft(nx.b)}${room}
        </div>
        <div class="next-until">
          Om ${until(nx.b-now)}
        </div>
      `;

    }else{

      next.innerHTML='';

    }

  }


  else if(nx){

    timer.classList.add('idle');


    lesson.textContent=
      `Nästa: ${nx.name}${nx.room ? `, sal ${nx.room}` : ''}`;

    range.textContent=
      `${names[nx.b.getDay()]} ${ft(nx.b)}–${ft(nx.e)}`;


    const [big,lab]=
      bigUntil(nx.b-now);


    remaining.textContent=
      big;

    label.textContent=
      lab;


    sector.style.setProperty(
      '--angle',
      '0deg'
    );


    next.innerHTML='';

  }


  else{

    lesson.textContent=
      'Ingen kommande lektion';

    range.textContent='';

    remaining.textContent='—';

    label.textContent='';

    sector.style.setProperty(
      '--angle',
      '0deg'
    );

    next.innerHTML='';

  }

}


/* -------------------------
   Dialog
------------------------- */

edit.onclick=()=>{

  overviewView.style.display='block';
  editorView.style.display='none';

  renderSchedule();

  dlg.showModal();

};


closeSchedule.onclick=()=>{

  dlg.close();

};


editSchedule.onclick=()=>{

  ta.value=
    localStorage.lessonSchedule || DEF;

  overviewView.style.display='none';
  editorView.style.display='block';

};


cancel.onclick=()=>{

  editorView.style.display='none';
  overviewView.style.display='block';

};


save.onclick=()=>{

  localStorage.lessonSchedule=
    ta.value;

  editorView.style.display='none';
  overviewView.style.display='block';

  renderSchedule();
  update();

};


update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
